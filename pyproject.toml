[project]
name = "d1w-robodog-autonomous-nav"
version = "0.1.0"
description = "Autonomous navigation experiments for the AgiBot D1 wheeled robot dog"
readme = "README.md"
# The vendor SDK's Python module is built for CPython 3.10 only (cp310).
requires-python = "==3.10.*"
dependencies = [
    "numpy>=1.26,<3",
    # OpenCV 5 is very new; stay on the proven 4.x line for the RTSP camera stream.
    "opencv-python>=4.10,<5",
    "pyyaml>=6",
    # Keyboard teleop window: real key press/release events (a terminal only sees presses).
    "pygame>=2.5",
]

[project.scripts]
robodog-status = "robodog.cli.status:main"
robodog-stand-test = "robodog.cli.stand_test:main"
robodog-teleop = "robodog.cli.teleop:main"
robodog-goto = "robodog.cli.goto:main"
robodog-depth = "robodog.cli.depth:main"
robodog-litter = "robodog.cli.litter:main"
robodog-obstacles = "robodog.cli.obstacles:main"
robodog-persons = "robodog.cli.persons:main"
robodog-trash = "robodog.cli.trash:main"

# Computer vision extras. Pick ONE (they pull different PyTorch builds):
#   uv sync --extra vision-cpu    # laptop without an NVIDIA GPU (small CPU-only PyTorch)
#   uv sync --extra vision-gpu    # laptop with an NVIDIA GPU (CUDA PyTorch, ~3 GB download)
[project.optional-dependencies]
# ultralytics = YOLO + ByteTrack for the trash tracker (note: AGPL-3.0 licensed); lap is ByteTrack's matcher.
vision-cpu = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.56", "pillow>=10", "ultralytics>=8.3.0", "lap>=0.5.12"]
vision-gpu = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.56", "pillow>=10", "ultralytics>=8.3.0", "lap>=0.5.12"]
# Listen to the robot's own ROS 2 topics (robotbus.py). Pinned to the robot's Zenoh version.
robot-bus = ["eclipse-zenoh==1.6.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The two vision extras use different PyTorch builds, so they can't be installed together.
conflicts = [[{ extra = "vision-cpu" }, { extra = "vision-gpu" }]]

# vision-cpu takes torch from PyTorch's CPU-only index; vision-gpu uses the default
# PyPI build, which includes CUDA on Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "vision-cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "vision-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robodog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # so tests can `import fake_robot`
