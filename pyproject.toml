[project]
name = "d1w-robodog-autonomous-nav"
version = "0.1.0"
description = "Autonomous navigation experiments for the AgiBot D1 wheeled robot dog"
readme = "README.md"
# The vendor SDK's Python module is built for CPython 3.10 only (cp310).
requires-python = "==3.10.*"
dependencies = [
    "numpy>=1.26,<3",
    # OpenCV 5 is very new; stay on the proven 4.x line for the RTSP camera stream.
    "opencv-python>=4.10,<5",
    "pyyaml>=6",
]

[project.scripts]
robodog-status = "robodog.cli.status:main"
robodog-dryrun = "robodog.cli.dryrun:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robodog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
