# SHARED settings, committed: edit in place, everyone gets your change.
# Never put passwords in here: this repo is public.
# Per-laptop settings (laptop_ip, sdk_dir, allow_motion) are in config.machine.yaml,
# which is created automatically on first run and ignored by git.

network:
  robot_ip: "192.168.234.1"     # Wi-Fi default; Ethernet is 192.168.168.168
  port: 43988                   # must match target_port on the robot; don't change

safety:
  # Conservative speed caps (the robot can do far more: vx 3.7 m/s, yaw 3 rad/s).
  # Keep these low until the stop tests in TESTING.md pass.
  max_vx: 0.3          # m/s forward/backward
  max_vy: 0.2          # m/s sideways
  max_yaw: 0.5         # rad/s turning

  min_battery: 25      # % - refuse to stand below this; lie down if it drops below while running
  rate_hz: 30          # control loop rate (robot watchdog trips after 3 s of silence)
  cmd_timeout: 0.3     # s - velocity resets to 0 if your code stops updating it (dead-man switch)
  connect_timeout: 5.0 # s - give up connecting after this
  battery_check_period: 1.0  # s

camera:
  # Front camera geometry, used by robodog-goto to turn a clicked pixel into a floor point.
  # Measure with the robot STANDING, then calibrate the pitch in robodog-goto (key K).
  lens: "fisheye"
  hfov_deg: 96.0          # fitted with K (3 objects, worst 3 %)
  height_m: 0.40           # measured 2026-11-15: floor to lens centre, robot standing
  pitch_deg: -8.7         # fitted with K: looking 8.7 deg up
  forward_offset_m: 0.4        # measured: lens in front of the robot's centre
  measured: true          # set true once the three values above are real: go-to driving needs it

goto:
  max_goal_m: 3.0          # refuse clicked goals further away than this
  max_vx: 0.15             # m/s (safety.max_vx still caps it)
  max_yaw: 0.3             # rad/s (safety.max_yaw still caps it)
  arrive_m: 0.10           # stop when this close to the goal
  timeout_s: 20.0          # stop if not there after this much driving
  stop_before_m: 0.55      # robot's MIDDLE stops this far short of the clicked point, facing it:
                           # with the lens 0.40 m in front of the middle, the nose ends ~15 cm before
                           # the target instead of driving over it. 0 = drive the middle onto the point
  odometry: "robot"        # where go-to thinks the robot is: "robot" = its own estimate (getPosition),
                           # "commanded" = our count (speed x time along the IMU heading). Try "commanded"
                           # if it overshoots once the goal is out of view (see TESTING.md test 18)
