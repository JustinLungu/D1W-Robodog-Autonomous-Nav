# SHARED settings, committed: edit in place, everyone gets your change.
# Never put passwords in here: this repo is public.
# Per-laptop settings (laptop_ip, sdk_dir, allow_motion) are in config.machine.yaml,
# which is created automatically on first run and ignored by git.

network:
  robot_ip: "192.168.234.1"     # Wi-Fi default; Ethernet is 192.168.168.168
  port: 43988                   # must match target_port on the robot; don't change

safety:
  # Conservative speed caps (the robot can do far more: vx 3.7 m/s, yaw 3 rad/s).
  # Keep these low until the stop tests in TESTING.md pass.
  max_vx: 0.3          # m/s forward/backward
  max_vy: 0.2          # m/s sideways
  max_yaw: 0.5         # rad/s turning

  min_battery: 25      # % - refuse to stand below this; lie down if it drops below while running
  rate_hz: 30          # control loop rate (robot watchdog trips after 3 s of silence)
  cmd_timeout: 0.3     # s - velocity resets to 0 if your code stops updating it (dead-man switch)
  connect_timeout: 5.0 # s - give up connecting after this
  battery_check_period: 1.0  # s

camera:
  # Front camera geometry, used by robodog-goto to turn a clicked pixel into a floor point.
  # Measure with the robot STANDING, then calibrate the pitch in robodog-goto (key K).
  lens: "fisheye"
  hfov_deg: 96.0          # fitted with K (3 objects, worst 3 %)
  height_m: 0.40           # measured 2026-11-15: floor to lens centre, robot standing
  crawl_height_m: 0.265    # crawling: body drops 0.385 -> 0.25 m (robot log, remote crawl 2026-11-15), so lens ~0.40 - 0.135
  pitch_deg: -8.7         # fitted with K: looking 8.7 deg up
  forward_offset_m: 0.4        # measured: lens in front of the robot's centre
  measured: true          # set true once the three values above are real: go-to driving needs it

# Crawl (X key in robodog-teleop and robodog-goto): the robot's real low crawl, the same as the
# remote's crawl button: body ~0.385 m -> ~0.25 m. Switched with the vendor app's UDP command
# (src/robodog/app_link.py; the SDK has no command for it), then it drives with the normal move().
crawl:
  change_s: 2.5        # seconds of silence while the body goes down (the remote's takes ~2 s; < 3 s watchdog)
  raise_s: 2.5         # the same while standing tall again
  min_drop_m: 0.05     # the body must drop at least this much, else "crawl failed" (robot drops ~0.13)
  max_vx: 0.15         # m/s while crawling (safety.max_vx still caps it)
  max_vy: 0.10         # m/s sideways while crawling
  max_yaw: 0.30        # rad/s while crawling

goto:
  max_goal_m: 3.0          # refuse clicked goals further away than this
  max_vx: 0.15             # m/s (safety.max_vx still caps it)
  max_yaw: 0.3             # rad/s (safety.max_yaw still caps it)
  arrive_m: 0.10           # stop when this close to the goal
  timeout_s: 20.0          # stop if not there after this much driving
  stop_before_m: 0.55      # robot's MIDDLE stops this far short of the clicked point, facing it:
                           # with the lens 0.40 m in front of the middle, the nose ends ~15 cm before
                           # the target instead of driving over it. 0 = drive the middle onto the point
  odometry: "robot"        # where go-to thinks the robot is: "robot" = its own estimate (getPosition),
                           # "commanded" = our count (speed x time along the IMU heading). Try "commanded"
                           # if it overshoots once the goal is out of view (see TESTING.md test 18)

# Trash detection + tracking (robodog-trash, robodog-goto --trash): YOLO finds trash, ByteTrack
# keeps one ID per piece, and go-to keeps its goal locked on the piece you clicked while the
# camera still sees it. Needs the vision extra.
trash:
  # YOLO weights: a local .pt path, or hf://<repo>/<file>. Default: YOLO11s fine-tuned on TACO
  # (classes: plastic bag & wrapper, cigarette, bottle, bottle cap, can, other plastic, carton, cup, other).
  model: "hf://fabiocigaina/TACO-yolo11s/best_model.pt"
  # Other models work too, e.g. Ultralytics' own "yolo11s.pt" (trained on COCO: knows cup, bottle...;
  # downloaded automatically) with classes: "cup, bottle". Or an open-vocabulary one like
  # "yolov8s-worldv2.pt", where classes are the words to look for: "cup, can, plastic bottle, paper".
  classes: ""            # comma-separated class names to keep. "" = everything the model knows
  conf: 0.25             # confidence needed to START tracking a piece. Lower = finds more, with more false boxes.
                         # (An existing track is continued with weaker detections too, down to 0.1.)
  imgsz: 896             # detector input size (this model was trained at 896). 640 is ~2x faster
  follow_vx: 0.12        # m/s while driving to a tracked piece: slow, so the tracker keeps up
  crawl_to_target: true  # holding G on a tracked piece first lowers the body (crawl section), then follows it
  camera_delay_s: 0.3    # how old a camera frame is when it arrives (camera + Wi-Fi)
  lost_after_s: 1.0      # not seen for this long -> finish blind, on odometry
  reacquire_m: 0.4       # the tracker renamed the piece: a track this close to the goal is taken as the same

# Camera-based obstacle WARNING (robodog-obstacles, robodog-teleop --obstacles).
# It only warns; it never stops the robot. All values are fractions of the camera image:
# x: 0 = left edge, 1 = right edge.  rows: 0 = top, 1 = bottom.
# See them on the live picture with `uv run robodog-obstacles`.
#
# Calibrated for the robot STANDING (README §6.9, "Calibration"), with margins of 10 cm
# beside each wheel and 10 cm above the robot. Measured camera: 40 cm above the floor,
# tilted 12 deg up, centred on the robot; fisheye lens (HFOV 122 deg, VFOV 70 deg).
# It sees no floor closer than 0.93 m; nearer obstacles are judged by their depth alone.
#
# Other postures need other values (the camera is lower). Derived the same way:
#              path_left  path_right  vanish_x  height_ratio  warn_row (0.8 m)
#   standing      0.34       0.64       0.488       0.37          1.06
#   crawling      0.25       0.75       0.496       0.64 (est.)   0.90
#   lying         0.18       0.76       0.482       0.46          0.89
obstacles:
  # Where the robot's path (wheel edges + 10 cm) leaves the picture at the bottom.
  path_left: 0.34
  path_right: 0.64
  vanish_x: 0.488      # where the robot's centre line meets the horizon (measured; the camera is centred)
  height_ratio: 0.37   # (robot top + 10 cm above the camera) / (camera above the floor): 52 cm. Higher things are driven under
  # Warning distance, as an image row (bigger = closer). For the robot standing:
  #   0.88 = 1.5 m   0.93 = 1.2 m   0.98 = 1.0 m   1.06 = 0.8 m   1.11 = 0.7 m   1.19 = 0.6 m   (from the camera)
  # 0.8 m: ~1 s of camera + processing delay at up to 0.6 m/s, plus a little braking.
  warn_row: 1.06
